[package]
name = "ry-reach-setup"
version = "0.1.0"
edition = "2021"
authors = ["Ray Zhang"]
license = "MIT"

[workspace]

[build-dependencies]
winresource = { version = "=0.1.34", default-features = false }

[dependencies]
anyhow = "1"
base64 = "0.22"
sha2 = "0.10"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_SystemInformation", "Win32_System_Registry"] }

[profile.release]
opt-level = "s"
strip = true
