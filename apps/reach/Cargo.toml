[package]
name = "ry-reach-node"
version = "0.1.0"
edition = "2021"
authors = ["Ray Zhang"]
license = "MIT"
description = "Reach Windows remote operation host"

[workspace]

[build-dependencies]
winresource = { version = "=0.1.34", default-features = false }

[[bin]]
name = "reach"
path = "src/node/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
fs2 = "0.4"
getrandom = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "json"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time", "io-util", "signal", "sync", "net"] }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Pipes", "Win32_System_Services", "Win32_System_Memory", "Win32_System_RemoteDesktop", "Win32_System_Environment"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.dev]
debug = "line-tables-only"
[profile.dev.package."*"]
debug = false
[profile.release]
opt-level = "s"
strip = true
