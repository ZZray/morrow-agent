[package]
name = "ry-reach-desktop-host"
version = "0.1.0"
edition = "2021"
authors = ["Ray Zhang"]
license = "MIT"
description = "Reach interactive Windows desktop Host over the shared ARA MCP adapter"

[workspace]

[build-dependencies]
winresource = { version = "=0.1.34", default-features = false }

[[bin]]
name = "reach-desktop"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
png = "0.18"
sha2 = "0.10"
morrow-agent-core = { version = "=0.1.1", path = "../../../crates/morrow-agent-core" }
morrow-agent-mcp = { version = "=0.1.0", path = "../../../crates/morrow-agent-mcp" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "io-std", "time", "sync", "process", "net"] }
tokio-util = { version = "0.7", features = ["rt"] }
uuid = { version = "1", features = ["v4"] }
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Pipes", "Win32_System_Services", "Win32_System_Threading", "Win32_System_RemoteDesktop", "Win32_System_StationsAndDesktops", "Win32_System_JobObjects", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_UI_HiDpi"] }

[profile.dev]
debug = "line-tables-only"
[profile.dev.package."*"]
debug = false
[profile.release]
opt-level = "s"
strip = true
