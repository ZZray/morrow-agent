<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0a0d13" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#eef1f4" media="(prefers-color-scheme: light)">
<title>Reach Desk · 登录</title>
<link rel="stylesheet" href="/style.css">
<style>
body.login-page{
  min-height:100vh; margin:0; display:grid; place-items:center;
  color:var(--text); font:14px/1.5 var(--sans);
}
.login-card{
  width:min(400px,92vw); padding:30px 26px;
  border-radius:24px;
  background:var(--panel-fill);
  border:var(--glass-edge);
  box-shadow:var(--glass-shadow);
  backdrop-filter:var(--mat-blur); -webkit-backdrop-filter:var(--mat-blur);
}
.login-card h1{font-size:20px; font-weight:650; margin:0 0 8px; letter-spacing:-.01em}
.login-card h1 span{color:var(--accent-text); font-weight:500}
.login-card p{color:var(--muted); font-size:13px; margin:0 0 20px; line-height:1.65}
.login-card .field{margin-bottom:12px}
.login-card .btn{width:100%; height:42px; border-radius:999px; font-size:14px}
.login-dl{
  display:block; margin:14px 0 0; text-align:center; text-decoration:none;
  color:var(--accent-text); font-size:13px; font-weight:500;
}
.login-dl:hover{opacity:.85}
#err{color:var(--dan); font-size:12.5px; min-height:18px; margin:10px 0 0}
@media (max-width:480px){
  body.login-page{padding:24px 14px calc(24px + env(safe-area-inset-bottom, 0px))}
  .login-card{padding:24px 18px; border-radius:20px}
}
@media (pointer:coarse){
  #token,#code{font-size:16px}
  .login-card .btn{min-height:46px}
}
</style>
<script>
(function(){
  try{
    var map={glass:'dark',obsidian:'dark',default:'dark',mist:'light'};
    var t=localStorage.getItem('handwave.console.theme');
    t=map[t]||t;
    if(t==='dark'||t==='light') document.documentElement.setAttribute('data-theme',t);
    else document.documentElement.setAttribute('data-theme','dark');
  }catch(e){ document.documentElement.setAttribute('data-theme','dark'); }
})();
</script>
</head>
<body class="login-page">
  <main class="login-card">
    <h1>Reach Desk <span>工作台</span></h1>
    <p>输入 hub 访问令牌进入。被控端小程序可先下载，无需登录。</p>
    <div id="step1">
      <input id="token" class="field" type="password" placeholder="访问令牌" autocomplete="off" spellcheck="false">
      <button id="btn" class="btn primary">进入</button>
    </div>
    <div id="step2" style="display:none">
      <img id="qr" alt="Authenticator 绑定二维码" style="display:none;width:180px;height:180px;margin:0 auto 10px;background:#fff;padding:8px;border-radius:12px">
      <p id="secretLine" style="display:none;color:var(--muted);font:12px/1.6 var(--mono);word-break:break-all;margin:0 0 10px"></p>
      <input id="code" class="field" type="text" inputmode="numeric" maxlength="6" placeholder="6 位验证码" autocomplete="one-time-code">
      <button id="btn2" class="btn primary">进入</button>
    </div>
    <a class="login-dl" href="/download">下载被控端</a>
    <div id="err"></div>
  </main>
<script>
const $ = (id) => document.getElementById(id);
(async () => {
  try {
    const nav = performance.getEntriesByType('navigation')[0];
    if (nav && nav.type === 'reload') {
      await fetch('/auth/logout', { method: 'POST', credentials: 'same-origin' });
    }
  } catch (e) {}
})();
let preauth = '', mode = '';
const showStep2 = (j) => {
  preauth = j.preauth || '';
  mode = j.totp || 'verify';
  $('step1').style.display = 'none';
  $('step2').style.display = 'block';
  $('btn2').textContent = mode === 'enroll' ? '绑定并进入' : '进入';
  if (mode === 'enroll') {
    $('qr').style.display = 'block';
    $('qr').src = '/auth/totp/qr?preauth=' + encodeURIComponent(preauth);
    $('secretLine').style.display = 'block';
    $('secretLine').textContent = '扫码或手动添加，密钥：' + (j.secret || '');
  }
  $('err').textContent = '';
  $('code').focus();
};
const submitCode = () => {
  const code = $('code').value.trim();
  if (!code) { $('err').textContent = '请输入验证码'; return; }
  $('btn2').disabled = true;
  fetch('/auth/totp', {
    method: 'POST',
    credentials: 'same-origin',
    headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ preauth, code })
  }).then(async (r) => {
    if (r.ok) { location.href = '/'; return; }
    const j = await r.json().catch(() => ({}));
    throw new Error(j.error || '验证失败');
  }).catch((e) => {
    $('err').textContent = e.message;
    $('btn2').disabled = false;
  });
};
const go = () => {
  const t = $('token').value.trim();
  if (!t) { $('err').textContent = '请输入令牌'; return; }
  $('btn').disabled = true;
  fetch('/auth/login', {
    method: 'POST',
    credentials: 'same-origin',
    headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ token: t })
  }).then(async (r) => {
    const j = await r.json().catch(() => ({}));
    if (r.ok) {
      if (j.totp) { showStep2(j); return; }
      location.href = '/';
      return;
    }
    throw new Error(j.error || '登录失败');
  }).catch((e) => {
    $('err').textContent = e.message;
    $('btn').disabled = false;
  });
};
$('btn').onclick = go;
$('btn2').onclick = submitCode;
$('token').addEventListener('keydown', (e) => { if (e.key === 'Enter') go(); });
$('code').addEventListener('keydown', (e) => { if (e.key === 'Enter') submitCode(); });
$('token').focus();
</script>
</body>
</html>
