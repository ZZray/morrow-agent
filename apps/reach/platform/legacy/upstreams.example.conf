# handwave hub AI 上游配置示例（复制为 /etc/handwave/upstreams.conf 或 exe 目录 upstreams.conf）
# default= 指定兜底上游；留空取第一个声明的
# api_key 留空则读 api_key_env 指定的环境变量

default=agnes

[agnes]
name=Agnes AI
base_url=https://api.agnes-ai.cn/v1
api_key=sk-你的key
api_key_env=AGNES_API_KEY
plan_model=agnes-2.5-flash
models=agnes-2.5-flash|2.5 Flash,agnes-2.5-pro|2.5 Pro

[openrouter]
name=OpenRouter
base_url=https://openrouter.ai/api/v1
api_key=sk-or-你的key
api_key_env=OPENROUTER_API_KEY
plan_model=openrouter/free
models=openrouter/free|Free Router

[modelscope]
name=ModelScope
base_url=https://api-inference.modelscope.cn/v1
api_key=ms-你的key
api_key_env=MODELSCOPE_API_KEY
plan_model=Qwen/Qwen3-Flash
models=Qwen/Qwen3-Flash|Qwen3 Flash
