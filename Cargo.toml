[workspace]
members = [
  "crates/morrow-agent-core",
  "crates/morrow-agent-harness",
  "crates/morrow-agent-jsonl",
  "crates/morrow-agent-mcp",
]
resolver = "3"
exclude = ["apps/reach", "apps/reach/desktop", "apps/reach/packaging/windows/setup"]

[workspace.package]
license = "MIT"
publish = false

[profile.dev]
debug = "line-tables-only"
incremental = false

[profile.dev.package."*"]
debug = false
