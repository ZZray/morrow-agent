[package]
name = "morrow-agent-jsonl"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Versioned cross-language Host sidecar over Morrow Harness"


[dependencies]
morrow-agent-harness = { path = "../morrow-agent-harness" }
morrow-agent-mcp = { path = "../morrow-agent-mcp" }
anyhow = "1"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
tokio = { version = "1", features = ["rt", "macros", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
url = "2"

[dev-dependencies]
proptest = { version = "=1.11.0", default-features = false, features = ["std"] }
